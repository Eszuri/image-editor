name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine Version
        id: version
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish ImageEditor.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}

      - name: Create Portable Zip
        run: Compress-Archive -Path "bin\Release\net8.0-windows\win-x64\publish\*" -DestinationPath "ImageEditor-portable-${{ steps.version.outputs.version }}.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} setup.iss
          Move-Item "Output\ImageEditorSetup.exe" "ImageEditor-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageEditor-${{ steps.version.outputs.version }}
          path: |
            ImageEditor-portable-${{ steps.version.outputs.version }}.zip
            ImageEditor-Setup-${{ steps.version.outputs.version }}.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Image Editor ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ImageEditor-portable-${{ steps.version.outputs.version }}.zip
            ImageEditor-Setup-${{ steps.version.outputs.version }}.exe
