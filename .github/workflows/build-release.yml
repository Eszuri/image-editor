# auto release 
name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version from tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ImageEditor.csproj

      - name: Publish (self-contained, single file, win-x64)
        run: >
          dotnet publish ImageEditor.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "bin\Release\net8.0-windows\win-x64\publish\*" `
            -DestinationPath "ImageEditor-portable-${{ steps.version.outputs.version }}.zip"

      # Installer hanya dibuat saat push tag rilis (v*.*.*), supaya
      # build biasa / PR tidak perlu menunggu Inno Setup terpasang.
      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} setup.iss
          Copy-Item "Output\ImageEditorSetup.exe" "ImageEditor-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-editor-${{ steps.version.outputs.version }}
          path: |
            ImageEditor-portable-${{ steps.version.outputs.version }}.zip
            ImageEditor-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Image Editor ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ImageEditor-portable-${{ steps.version.outputs.version }}.zip
            ImageEditor-Setup-${{ steps.version.outputs.version }}.exe
